# Example file for theme publishing

[[project]]
id = "theme-vscode"
repo = "your-org/theme-vscode"
branch = "main"
version = "1.0.0"
version_files = [
    { path = "package.json", field = "version", kind = "json" },
]
changelog_file = "CHANGELOG.md"
publish_workflow = "publish-vscode.yml"
github_release = true
release_assets = ["*.vsix"]

[[project]]
id = "theme-jetbrains"
repo = "your-org/theme-jetbrains"
branch = "main"
version = "1.0.0"
version_files = [
    { path = "resources/META-INF/plugin.xml", field = "version", kind = "xml" },
]
changelog_file = "CHANGELOG.md"
publish_workflow = "publish-jetbrains.yml"
github_release = true
release_assets = ["*.jar"]

[[project]]
id = "theme-zed"
repo = "your-org/theme-zed"
extension_name = "theme-zed"
branch = "master"
version = "1.0.0"
version_files = [
    { path = "extension.toml", field = "version", kind = "toml" },
]
changelog_file = "CHANGELOG.md"
publish_workflow = "publish-zed.yml"
pr = true
pr_template = "templates/release.md"